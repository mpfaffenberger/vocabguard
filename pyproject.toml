[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'vocabguard'
version = "0.2.0"
description = 'Pydantic AI capability that catches vocabulary drift in agent-written prose before the write lands'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.11'
authors = [{ name = 'Michael Pfaffenberger' }]
keywords = ['pydantic-ai', 'agents', 'writing', 'lint', 'vocabulary']
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Typing :: Typed',
]
dependencies = [
    'pydantic-ai-slim>=2.35',
    'simplemma>=1.0',
]

[project.optional-dependencies]
structural = ['spacy']

[project.scripts]
vocabguard = 'vocabguard.cli:main'

[dependency-groups]
dev = [
    'anyio>=4',
    'pyright>=1.1.400',
    'pytest>=8',
    'ruff>=0.11',
]

[tool.hatch.build.targets.wheel]
packages = ['vocabguard']

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
extend-select = ['Q', 'I', 'UP', 'B', 'C4', 'RUF']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'double'

[tool.ruff.format]
quote-style = 'single'

[tool.pyright]
typeCheckingMode = 'strict'
pythonVersion = '3.11'
include = ['vocabguard', 'tests']
reportUnnecessaryTypeIgnoreComment = true
executionEnvironments = [{ root = 'tests', reportUnusedFunction = false }]

[tool.pytest.ini_options]
testpaths = ['tests']
filterwarnings = ['error']
